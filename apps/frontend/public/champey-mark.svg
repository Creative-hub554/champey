<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Champey brand mark: letter C with a plumeria nested in its mouth.
       Matches ChampeyCMarkIcon in src/components/icons/khmer-flora.tsx —
       keep the two in sync. -->
  <defs>
    <linearGradient id="champey-c-grad" x1="20" y1="20" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f5b8c4"/>
      <stop offset="0.5" stop-color="#e879a6"/>
      <stop offset="1" stop-color="#c2497f"/>
    </linearGradient>
  </defs>
  <!-- The C — 300° arc, round caps, opening to the right -->
  <path d="M89.6 33.6 A 40 40 0 1 0 89.6 94.4"
        stroke="url(#champey-c-grad)" stroke-width="22.4" stroke-linecap="round"/>
  <!-- Plumeria in the C's mouth -->
  <g fill="url(#champey-c-grad)">
    <circle cx="93.9" cy="64.8" r="4.8" fill="#ffd9a8"/>
    <ellipse cx="93.9" cy="52" rx="6.1" ry="8.5"/>
    <ellipse cx="106.1" cy="60.7" rx="6.1" ry="8.5" transform="rotate(72 106.1 60.7)"/>
    <ellipse cx="101.9" cy="74.5" rx="6.1" ry="8.5" transform="rotate(144 101.9 74.5)"/>
    <ellipse cx="86.6" cy="74.5" rx="6.1" ry="8.5" transform="rotate(216 86.6 74.5)"/>
    <ellipse cx="82.4" cy="60.7" rx="6.1" ry="8.5" transform="rotate(288 82.4 60.7)"/>
  </g>
</svg>
