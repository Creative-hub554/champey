name: Docker Build & Deploy

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

env:
  REGISTRY: docker.io

jobs:
  # ============================================================================
  # Build and test images
  # ============================================================================
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Detect Docker Hub credentials
        # The secrets context is unavailable in step if:/with:, so probe it
        # here (run: allows secrets) and branch on env.HAS_DOCKER_CREDS below.
        # Inert until Docker Hub secrets exist (see docs/deployment.md).
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          if [ -n "$DOCKER_USERNAME" ]; then
            echo "HAS_DOCKER_CREDS=true" >> "$GITHUB_ENV"
          else
            echo "HAS_DOCKER_CREDS=false" >> "$GITHUB_ENV"
            echo "DOCKER_USERNAME not set — skipping image builds/pushes (see docs/deployment.md)"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.HAS_DOCKER_CREDS == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # ---- Backend ----
      - name: Build and push backend image
        if: env.HAS_DOCKER_CREDS == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}/{1}-backend:buildcache,mode=max', env.REGISTRY, env.IMAGE_NAME) || '' }}

      # ---- Frontend ----
      - name: Build and push frontend image
        if: env.HAS_DOCKER_CREDS == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/frontend/Dockerfile
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.example.com
            NEXT_PUBLIC_SITE_URL=https://example.com
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}/{1}-frontend:buildcache,mode=max', env.REGISTRY, env.IMAGE_NAME) || '' }}

      # ---- Admin ----
      - name: Build and push admin image
        if: env.HAS_DOCKER_CREDS == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/admin/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-admin:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-admin:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-admin:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}/{1}-admin:buildcache,mode=max', env.REGISTRY, env.IMAGE_NAME) || '' }}

  # ============================================================================
  # Security scanning
  # ============================================================================
  scan:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Detect Docker Hub credentials
        # HAS_DOCKER_CREDS is job-local to build; re-detect here. Scout scans
        # registry images, so it only makes sense when they were pushed.
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          if [ -n "$DOCKER_USERNAME" ]; then
            echo "HAS_DOCKER_CREDS=true" >> "$GITHUB_ENV"
          else
            echo "HAS_DOCKER_CREDS=false" >> "$GITHUB_ENV"
            echo "DOCKER_USERNAME not set — skipping Docker Scout scans (see docs/deployment.md)"
          fi

      - name: Run Docker Scout on backend
        if: env.HAS_DOCKER_CREDS == 'true'
        uses: docker/scout-action@v1
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ github.sha }}
          sbom: true

      - name: Run Docker Scout on frontend
        if: env.HAS_DOCKER_CREDS == 'true'
        uses: docker/scout-action@v1
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:${{ github.sha }}
          sbom: true

      - name: Run Docker Scout on admin
        if: env.HAS_DOCKER_CREDS == 'true'
        uses: docker/scout-action@v1
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-admin:${{ github.sha }}
          sbom: true

  # ============================================================================
  # Deploy to staging/production
  # ============================================================================
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [build, scan]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_HOST:-}" ]; then
            echo "DEPLOY_HOST not configured - skipping deploy (see docs/deployment.md)"
            exit 0
          fi
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          printf '%s' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key" && chmod 600 "$HOME/.ssh/deploy_key"
          ssh -i "$HOME/.ssh/deploy_key" -o StrictHostKeyChecking=accept-new "${DEPLOY_USER}@${DEPLOY_HOST}" 'set -euo pipefail; cd /srv/champey; git pull --ff-only origin main; docker compose -f docker/compose.prod.yml build --pull; docker compose -f docker/compose.prod.yml up -d; docker compose -f docker/compose.prod.yml ps'
